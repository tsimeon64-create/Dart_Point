<!DOCTYPE html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <script>
      // ── Pare-chocs anti écran-noir : la traduction automatique du navigateur
      //    (Google / Samsung Translate) modifie le DOM dans le dos de React et
      //    provoque "Failed to execute 'removeChild' on 'Node'". On rend
      //    removeChild / insertBefore tolérants au lieu de faire planter l'appli.
      (function () {
        if (typeof Node !== "function" || !Node.prototype) return;
        var _remove = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) return child;
          return _remove.apply(this, arguments);
        };
        var _insert = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, ref) {
          if (ref && ref.parentNode !== this) return newNode;
          return _insert.apply(this, arguments);
        };
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DartPoint" />
    <title>DartPoint — Trouvez où jouer aux fléchettes</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body style="background:#0f0f0f;color:#f1f5f9;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
